<!DOCTYPE html>
<html>
<head>
    <title>Intraday Comparison - Weather Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .container { max-width: 1000px; }
        .controls { margin: 20px 0 10px; }
        .controls label { font-weight: bold; color: #333; margin-right: 8px; }
        .controls input[type="date"] {
            padding: 8px; font-size: 15px; border: 2px solid #ddd; border-radius: 4px;
        }
        .chart-wrap { margin-top: 10px; }
        #status { color: #666; margin-top: 12px; font-size: 14px; }
        #nowcast { margin-top: 24px; }
        #nowcast h3 { margin-bottom: 8px; }
        #nowcast .muted { color: #888; font-size: 12px; }
        #nowcast .ladder-table { margin-top: 10px; max-width: 360px; }
        #nowcast .ladder-table th { font-size: 12px; color: #666; }
        #nowcast .bar-cell { position: relative; }
        #nowcast .bar-cell .bar {
            display: inline-block; height: 11px; background: #a5d8ff; border-radius: 2px;
            margin-right: 6px; vertical-align: middle; min-width: 1px;
        }
        #deltas { margin-top: 24px; }
        #deltas h3 { margin-bottom: 8px; }
        .delta-table { border-collapse: collapse; width: 100%; max-width: 560px; }
        .delta-table th, .delta-table td {
            text-align: left; padding: 8px 10px; border-bottom: 1px solid #ddd; font-size: 14px;
        }
        .delta-table th { border-bottom: 2px solid #333; color: #333; }
        .delta-table .muted { color: #999; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Intraday Temperature &mdash; KNYC</h1>

        <div class="navigation">
            <a href="/" class="nav-link">Back to Dashboard</a>
        </div>

        <p class="info-text">Wunderground PWS readings vs. NWS (METAR) observed temperature for the selected day.</p>

        <div class="controls">
            <label for="date-input">Date:</label>
            <input type="date" id="date-input">
        </div>

        <div class="chart-wrap">
            <canvas id="intraday-chart" height="120"></canvas>
        </div>

        <div id="nowcast"></div>

        <div id="deltas"></div>

        <p id="status">Loading&hellip;</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
    <script src="{{ url_for('static', filename='js/intraday.js') }}"></script>
</body>
</html>
